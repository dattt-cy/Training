spring:
  application:
    name: employee-management
  profiles:
    active: dev
  jpa:
    open-in-view: false
  cache:
    cache-names: employeeReport
    caffeine:
      spec: expireAfterWrite=60s

server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

app:
  jwt:
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

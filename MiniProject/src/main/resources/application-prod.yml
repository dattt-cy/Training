spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_management_prod?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    root: WARN
    com.example.ems: INFO
  file:
    name: logs/employee-management.log

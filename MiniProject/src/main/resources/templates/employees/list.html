<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Danh sách nhân viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Danh sách nhân viên</h3>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/employees/add}" class="btn btn-success">+ Thêm nhân viên</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <table th:replace="~{fragments/layout :: employeeTable(${employees})}"></table>

    <p class="text-muted">Tổng: <b th:text="${#lists.size(employees)}">0</b> nhân viên</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">EMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/employees/list}">EMS</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/employees/list}">Danh sách</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/employees/add}">Thêm nhân viên</a>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/employees/search}">Tìm kiếm</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/employees/statistics}">Thống kê</a></li>
        </ul>
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
            <span class="navbar-text text-white me-3">
                <b sec:authentication="name">user</b>
                <span class="badge bg-light text-primary ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-light text-primary ms-1" sec:authorize="!hasRole('ADMIN')">USER</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<table th:fragment="employeeTable(employees)" class="table table-bordered table-hover align-middle">
    <thead class="table-light">
    <tr>
        <th>#</th>
        <th>Mã NV</th>
        <th>Họ tên</th>
        <th>Email</th>
        <th>Phòng ban</th>
        <th class="text-end">Lương (VNĐ)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="6" class="text-center text-muted">Không có nhân viên nào</td>
    </tr>
    <tr th:each="e, stat : ${employees}">
        <td th:text="${stat.count}">1</td>
        <td th:text="${e.code}">NV0001</td>
        <td th:text="${e.fullName}">Nguyễn Văn An</td>
        <td th:text="${e.email}">an@gmail.com</td>
        <td th:text="${e.department != null ? e.department.name : ''}">IT</td>
        <td class="text-end"
            th:text="${e.salary != null ? #numbers.formatDecimal(e.salary, 0, 'POINT', 0, 'COMMA') : ''}">15.000.000</td>
    </tr>
    </tbody>
</table>
</body>
</html>

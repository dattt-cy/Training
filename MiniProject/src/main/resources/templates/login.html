<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Đăng nhập</h3>

            <div th:if="${param.error}" class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu</div>
            <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất</div>
            <div th:if="${param.registered}" class="alert alert-success">Đăng ký thành công, hãy đăng nhập</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
